suite: OnePasswordItem template
templates:
  - secrets.yaml
tests:
  - it: emits nothing when secrets are disabled
    set:
      app.env: development
      deployment.sha: testsha
      app.secrets.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: points at the vault item and auto-restarts on rotation
    set:
      app.env: staging
      deployment.sha: testsha
      app.secrets.enabled: true
      app.secrets.name: 'Engineering - Staging'
      app.secrets.itemPath: apple-pay-automation-secrets
    asserts:
      - isKind:
          of: OnePasswordItem
      - equal:
          path: spec.itemPath
          value: 'vaults/Engineering - Staging/items/apple-pay-automation-secrets'
      - equal:
          path: metadata.annotations["operator.1password.io/auto-restart"]
          value: 'true'

  - it: hash-versions its name so a spec change rolls the pod
    set:
      app.env: staging
      deployment.sha: testsha
      app.secrets.enabled: true
    asserts:
      - matchRegex:
          path: metadata.name
          pattern: ^RELEASE-NAME-[0-9a-f]{5}$
