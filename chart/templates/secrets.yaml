{{- if .Values.app.secrets.enabled }}
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  # Hash-versioned name — see _helpers.tpl app.secretVersion for why rotating a
  # value does not change it but editing the spec does.
  name: {{ include "app.fullname" . }}-{{ include "app.secretVersion" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
    app.kubernetes.io/component: app
    {{- include "app.datadogLabels" . | nindent 4 }}
  annotations:
    # The 1Password Operator watches this annotation. When the vault item
    # rotates, the operator refreshes the k8s Secret AND rolls every Deployment
    # mounting it — no manual `kubectl rollout restart`.
    operator.1password.io/auto-restart: 'true'
spec:
  itemPath: 'vaults/{{ .Values.app.secrets.name }}/items/{{ .Values.app.secrets.itemPath }}'
{{- end }}
